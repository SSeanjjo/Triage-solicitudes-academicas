name: CI — Tests y Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Tests del Backend ──────────────────────────────────────
  backend-tests:
    name: Backend — Tests JUnit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache de dependencias Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('backend/**/*.gradle*') }}

      - name: Dar permisos al gradlew
        run: chmod +x backend/gradlew

      - name: Correr tests del backend
        working-directory: backend
        run: ./gradlew test --no-daemon
        env:
          DB_USERNAME: test_user
          DB_PASSWORD: test_pass
          GEMINI_API_KEY: fallback

      - name: Publicar reporte de tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-report
          path: backend/build/reports/tests/

  # ── Job 2: Build del Backend ──────────────────────────────────────
  backend-build:
    name: Backend — Compilar JAR
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('backend/**/*.gradle*') }}

      - name: Dar permisos al gradlew
        run: chmod +x backend/gradlew

      - name: Compilar JAR
        working-directory: backend
        run: ./gradlew bootJar --no-daemon
        env:
          DB_USERNAME: placeholder
          DB_PASSWORD: placeholder
          GEMINI_API_KEY: fallback

      - name: Guardar JAR como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/*.jar

  # ── Job 3: Build del Frontend ─────────────────────────────────────
  frontend-build:
    name: Frontend — Compilar Angular
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm install

      - name: Compilar Angular
        working-directory: frontend
        run: npm run build

      - name: Guardar build como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

name: CD — Despliegue a Render

on:
  workflow_run:
    workflows: ["CI — Tests y Build"]  # ← debe ser el name exacto de tu ci.yml
    types:
      - completed
    branches: [main]

jobs:
  deploy:
    name: Desplegar a Render
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}  # ← solo si CI pasó
    steps:
      - name: Desplegar Backend
        run: |
          curl -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_BACKEND_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'

      - name: Desplegar Frontend
        run: |
          curl -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_FRONTEND_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'
<mat-toolbar color="primary" class="navbar">
  <a class="brand" routerLink="/dashboard">
    <mat-icon>school</mat-icon>
    <span class="brand-text">Sistema de Triage Académico</span>
  </a>

  <span class="spacer"></span>

  @if (auth.isAuthenticated()) {
    <nav class="nav-links">
      <a mat-button routerLink="/dashboard" routerLinkActive="nav-active" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon>dashboard</mat-icon> Dashboard
      </a>
      <a mat-button routerLink="/solicitudes" routerLinkActive="nav-active">
        <mat-icon>assignment</mat-icon> Solicitudes
      </a>
      @if (auth.hasRole(Rol.ADMINISTRADOR)) {
        <a mat-button routerLink="/usuarios" routerLinkActive="nav-active">
          <mat-icon>people</mat-icon> Usuarios
        </a>
      }
    </nav>

    <button mat-button [matMenuTriggerFor]="userMenu" class="user-btn">
      <mat-icon>account_circle</mat-icon>
      <span class="user-name">{{ auth.currentUser()?.nombre }}</span>
      <span class="role-pill">{{ auth.currentRole() }}</span>
      <mat-icon>arrow_drop_down</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu">
      <div class="menu-header">
        <div class="menu-name">{{ auth.currentUser()?.nombre }}</div>
        <div class="menu-role">{{ auth.currentRole() }}</div>
      </div>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="auth.logout()">
        <mat-icon>logout</mat-icon>
        <span>Cerrar Sesión</span>
      </button>
    </mat-menu>
  }
</mat-toolbar>

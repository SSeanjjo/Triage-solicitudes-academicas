spring.application.name=gestion-solicitudes
# Base de datos MariaDB
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Puerto
server.port=${PORT:8080}

# IA - Gemini
ai.gemini.enabled=true
ai.gemini.api-key=${GEMINI_API_KEY:fallback}
ai.gemini.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent
ai.gemini.timeout-ms=5000
